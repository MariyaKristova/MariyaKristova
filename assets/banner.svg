<svg viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89CFF0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B4A7D6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB6D9;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="60" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="1100" cy="220" r="80" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="1050" cy="50" r="50" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="150" cy="250" r="40" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- Main text -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
    Hello World,
  </text>
  
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
    I'm Mariya 👋
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#2C5F7C" text-anchor="middle">
    Backend | Frontend | DevOps
  </text>
  
  <!-- Username -->
  <text x="600" y="215" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.95">
    @MariyaKristova
  </text>
  
  <!-- Icons -->
  <!-- Python Icon -->
  <g transform="translate(380, 260)">
    <rect width="45" height="45" rx="8" fill="#3776AB"/>
    <rect width="45" height="45" rx="8" fill="#FFD43B" opacity="0.7"/>
    <path d="M 22.5 10 C 18 10 15 13 15 17.5 L 15 20 L 22.5 20 L 22.5 22 L 15 22 C 11 22 8 25 8 29.5 C 8 34 11 37 15 37 L 18 37 L 18 32.5 C 18 28 21 25 25.5 25 L 30 25 C 33.5 25 37 21.5 37 18 L 37 17.5 C 37 13 34 10 29.5 10 L 22.5 22.5 Z M 20 15 C 21.1 15 22 14.1 22 13 C 22 11.9 21.1 11 20 11 C 18.9 11 18 11.9 18 13 C 18 14.1 18.9 15 20 15 Z" fill="#FFFFFF"/>
  </g>

  <!-- Django Icon -->
  <g transform="translate(450, 260)">
    <circle cx="22.5" cy="22.5" r="22.5" fill="#092E20"/>
    <rect x="15" y="10" width="4" height="25" fill="#FFFFFF" rx="2"/>
    <rect x="22" y="10" width="4" height="15" fill="#FFFFFF" rx="2"/>
    <ellipse cx="24" cy="28" rx="2" ry="3" fill="#FFFFFF"/>
  </g>

  <!-- Docker Icon -->
  <g transform="translate(520, 260)">
    <circle cx="22.5" cy="22.5" r="22.5" fill="#2496ED"/>
    <rect x="10" y="18" width="6" height="5" fill="#FFFFFF" rx="1"/>
    <rect x="17" y="18" width="6" height="5" fill="#FFFFFF" rx="1"/>
    <rect x="24" y="18" width="6" height="5" fill="#FFFFFF" rx="1"/>
    <rect x="17" y="12" width="6" height="5" fill="#FFFFFF" rx="1"/>
    <rect x="24" y="12" width="6" height="5" fill="#FFFFFF" rx="1"/>
    <path d="M 22.5 28 Q 15 30 12 26 M 22.5 28 Q 30 30 33 26" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>

  <!-- JavaScript Icon -->
  <g transform="translate(590, 260)">
    <rect width="45" height="45" rx="5" fill="#F7DF1E"/>
    <text x="22.5" y="28" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">JS</text>
  </g>
</svg>
